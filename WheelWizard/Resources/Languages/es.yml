      title: Se encontraron mods
    launch_clear_patches_found:
      extra: Vas a lanzar el juego sin mods. ¿Deseas vaciar la carpeta de Parches?
        ¡Lanzando el juego de todos modos se ejecutará con la carpeta actual de parches
        todavía activada!
    move_data:
      extra: |-
        Wheel Wizard moverá sus archivos a:
        %{path}
        Puede tardar un rato dependiendo de la cantidad de datos.
      title: "¿Mover datos de Wheel Wizard?"
    new_version_wh_wz:
      extra: La versión %{latestVersion} de Wheel Wizard está disponible (actualmente
        en %{currentVersion}). ¿Deseas actualizar ahora?
      title: Actualización de Wheel Wizard disponible
    old_rksys_found:
      extra: Datos de guardado antiguos encontrados. ¿Deseas usarlos? (recomendado)
      title: Archivo rksys.dat antiguo encontrado
    recomp_nand_mode:
      extra: Dolphin recomienda en contra de que otros programas usen sus datos de
        Wii (NAND) directamente, ya que dos programas escribiendo a la vez pueden
        dañar los datos. Por ello, una copia mantiene separado completamente a WiiCompiled,
        pero el progreso realizado en uno no aparecerá en el otro.
      title: "¿Copiar tus datos de Dolphin, o usarlos directamente?"
    recomp_overwrite_dolphin_clone:
      extra: Esto reemplaza el clonado actual con los datos de Dolphin. Se perderán
        los guardados, Miis y ajustes de Wii que se hayan cambiado solamente en WiiCompiled.
      title: "¿Reemplazar el clonado privado de Dolphin?"
    recomp_retro_wfc_unavailable:
      extra: WiiCompiled necesita los servidores de Retro WFC para preparar juegos
        en línea, y en estos momentos no responden. Puedes instalarlo ahora en modo
        sin internet; WiiCompiled los habilitará automáticamente la próxima vez que
        actualices una vez se restauren los servidores.
      title: No se ha podido contactar con Retro WFC.
    recomp_share_dolphin_data:
      extra: Clonar otorga a WiiCompiled los datos de guardado, Miis y ajustes de
        Wii actuales, pero mantiene su copia separada y es más seguro. El compartir
        directamente permite que Dolphin y WiiCompiled escriban a la misma NAND, lo
        cual puede causar que se dañen los datos si ambos se ejecutan a la vez. Continúa
        solamente si comprendes el riesgo.
      title: "¿Compartir datos NAND con Dolphin?"
    recomp_uninstall:
      extra_copy: Esto borrará tu instalación de WiiCompiled, incluyendo su copia
        de tus datos de Dolphin. Tus datos originales de Dolphin no se tocarán, y
        Retro Rewind permanecerá instalado.
      extra_private: Esto borrará tu instalación de WiiCompiled, incluyendo los datos
        de guardado privados de la Wii. Retro Rewind permanecerá instalado.
      extra_shared: Esto borrará tu instalación de WiiCompiled. Tus datos guardados
