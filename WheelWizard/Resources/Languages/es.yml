    rr_not_determined:
      title: "Instalar Retro Rewind"
      extra: "No se pudo determinar tu versión de Retro Rewind. ¿Deseas instalar Retro Rewind?"
    recomp_uninstall:
      title: "¿Desinstalar WiiCompiled?"
      extra_shared: "Esto borrará tu instalación de WiiCompiled. Tus datos guardados permanecerán en la carpeta Wii de Dolphin, y Retro Rewind permanecerá instalado."
      extra_private: "Esto borrará tu instalación de WiiCompiled, incluyendo los datos de guardado privados de la Wii. Retro Rewind permanecerá instalado."
      extra_copy: "Esto borrará tu instalación de WiiCompiled, incluyendo su copia de tus datos de Dolphin. Tus datos originales de Dolphin no se tocarán, y Retro Rewind permanecerá instalado."
    recomp_use_dolphin_nand:
      title: "¿Usar tus datos de guardado de Dolphin?"
      extra: "WiiCompiled puede jugar con tus datos guardados, Miis y claves de amigo que ya hayas usado en Dolphin. En caso contrario, empezará de cero con sus propios datos de Wii."
    recomp_retro_wfc_unavailable:
      title: "No se ha podido contactar con Retro WFC."
      extra: "WiiCompiled necesita los servidores de Retro WFC para preparar juegos en línea, y en estos momentos no responden. Puedes instalarlo ahora en modo sin internet; WiiCompiled los habilitará automáticamente la próxima vez que actualices una vez se restauren los servidores."
    recomp_nand_mode:
      title: "¿Copiar tus datos de Dolphin, o usarlos directamente?"
      extra: "Dolphin recomienda en contra de que otros programas usen sus datos de Wii (NAND) directamente, ya que dos programas escribiendo a la vez pueden dañar los datos. Por ello, una copia mantiene separado completamente a WiiCompiled, pero el progreso realizado en uno no aparecerá en el otro."
    recomp_share_dolphin_data:
      title: "¿Compartir datos NAND con Dolphin?"
      extra: "Clonar otorga a WiiCompiled los datos de guardado, Miis y ajustes de Wii actuales, pero mantiene su copia separada y es más seguro. El compartir directamente permite que Dolphin y WiiCompiled escriban a la misma NAND, lo cual puede causar que se dañen los datos si ambos se ejecutan a la vez. Continúa solamente si comprendes el riesgo."
    recomp_overwrite_dolphin_clone:
      title: "¿Reemplazar el clonado privado de Dolphin?"
      extra: "Esto reemplaza el clonado actual con los datos de Dolphin. Se perderán los guardados, Miis y ajustes de Wii que se hayan cambiado solamente en WiiCompiled."
    move_data:
      title: "¿Mover datos de Wheel Wizard?"
      extra: |-
        Wheel Wizard moverá sus archivos a:
        {$1}
        Puede tardar un rato dependiendo de la cantidad de datos.
    dolphin_outdated:
      title: "Tu emulador Dolphin es una versión antigua"
      extra: |-
        Esta versión de Dolphin ({$1}) contiene una vulnerabilidad de seguridad donde archivos maliciosos, mods o hackers pueden infectar tu PC con malware.

        Actualiza a {$2} o más reciente para estar seguro.
