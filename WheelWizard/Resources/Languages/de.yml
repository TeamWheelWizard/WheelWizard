      extra: |-
        Diese Dolphin-Version (%{currentVersion}) hat eine bekannte Sicherheitslücke, mit welcher schädliche Spieldateien, Mods, oder cheatende Online-Spieler deinen PC mit Malware infizieren können.

        Update Dolphin auf die Version %{minimumVersion} oder neuer, um sicher zu sein.
      title: Die Dolphin Emulator-Version ist veraltet
    dolphin_program_found:
      extra: |-
        Wenn du nicht weißt, was das alles bedeutet, klick einfach auf „Ja“ :)

        Dolphin Emulator gefunden. Möchtest du Folgendes verwenden?
      title: Dolphin Emulator gefunden
    enter_mod_name:
      title: 'Mod-Name:'
    enter_new_name:
      extra: Name von %{name} ändern
      title: Einen neuen Namen eingeben
    install_mod:
      title: Möchtest du den Mod %{modName} herunterladen und installieren?
    launch_clear_mods_found:
      extra: Du bist dabei, das Spiel ohne Mods zu starten. Möchtest du deinen "My
        Stuff"-Ordner leeren?
      title: Mods gefunden
    launch_clear_patches_found:
      extra: Du bist dabei, das Spiel ohne Mods zu starten. Möchtest du deinen "Patches"-Ordner
        leeren? Startest du das Spiel trotzdem, bleiben die Patches aktiv!
    move_data:
      extra: |-
        Wheel Wizard wird seine Datein nach
        %{path}
        verschieben. Das könnte eine Weile dauern.
      title: Wheel Wizard Daten verschieben?
    new_version_wh_wz:
      extra: Version %{latestVersion} von Wheel Wizard ist verfügbar (die derzeitige
        Version ist %{currentVersion}). Möchtest du jetzt updaten?
      title: Wheel Wizard Update verfügbar
    old_rksys_found:
      extra: Alte Speicherdaten wurden gefunden. Möchtest du sie benutzen? (Empfohlen)
      title: Alte rksys.dat gefunden
    recomp_nand_mode:
      extra: Dolphin rät davon ab, andere Programme direkten Zugriff auf die Wii-Daten
        (NAND) zu geben, da es zu Datenverlusten kommen kann, wenn zwei Programme
        gleichzeitig darauf schreiben. Durch eine Kopie bleibt WiiCompiled vollständig
        getrennt, allerdings werden die in einem Programm erzielten Fortschritte nicht
        im anderen angezeigt.
      title: Sollen die Dolphin-Speicherdaten direkt verwendet werden?
    recomp_overwrite_dolphin_clone:
      extra: Dies ersetzt den aktuellen Klon durch die Daten von Dolphin. Speicherdaten,
        Miis und Wii-Einstellungen, die nur in WiiCompiled geändert wurden, gehen
        dabei verloren.
      title: Den privaten Dolphin-Klon ersetzen?
    recomp_retro_wfc_unavailable:
      extra: WiiCompiled benötigt die Retro-WFC-Server, um Online-Spiele einzurichten,
        doch diese reagieren momentan nicht. Du kannst jetzt ohne Online-Spiel installieren;
        WiiCompiled fügt es automatisch hinzu, sobald du das nächste Mal aktualisierst,
        nachdem die Server wieder verfügbar sind.
      title: Retro WFC ist nicht erreichbar
    recomp_share_dolphin_data:
      extra: Beim Klonen erhält WiiCompiled die gleichen aktuellen Speicherdaten,
        Miis und Wii-Einstellungen, behält aber eine getrennte Kopie und ist sicherer.
        Bei direkter Freigabe schreiben Dolphin und WiiCompiled auf dasselbe NAND,
        was es beschädigen kann, wenn beide gleichzeitig laufen. Fahre nur fort, wenn
        du das Risiko verstehst.
      title: NAND-Daten mit Dolphin teilen?
    recomp_uninstall:
      extra_copy: Dies entfernt die WiiCompiled-Installation inklusive ihrer Kopie
        der Dolphin-Speicherdaten. Die Original-Dolphin-Speicherdaten werden nicht
        gelöscht und Retro Rewind bleibt weiterhin installiert.
      extra_private: Dies entfernt die WiiCompiled-Installation inklusive den privaten
        Wii-Speicherdaten. Retro Rewind bleibt weiterhin installiert.
      extra_shared: Dies entfernt die WiiCompiled-Installation. Die Speicherdaten
        bleiben in Dolphin's "Wii"-Ordner und Retro Rewind bleibt weiterhin installiert.
      title: WiiCompiled deinstallieren?
    recomp_use_dolphin_nand:
      extra: WiiCompiled kann mit den Speicherdaten, Miis und Freundescodes, die bereits
        in Dolphin genutzt werden, verwendet werden. Wenn nicht, werden diese Wii-Daten
        neu angelegt.
      title: Sollen die Dolphin-Speicherdaten verwendet werden?
    reinstall_rr:
      extra: Bist du dir sicher, dass du Retro Rewind neu installieren möchtest?
      title: Installiere Retro Rewind neu
    rr_not_determined:
      extra: Deine Version von Retro Rewind konnte nicht ermittelt werden. Möchtest
        du Retro Rewind herunterladen?
      title: Installiere Retro Rewind
    rr_to_old:
      extra: Deine Version von Retro Rewind ist zu alt, um sie aktualisieren zu können.
        Möchtest du stattdessen Retro Rewind neu installieren?
      title: Retro Rewind-Version ist zu alt.
    search_mod: Nach Mods suchen...
    sure_delete:
      extra: Löschen ist permanent und kann nicht rückgängig gemacht werden
      title: Bist du sicher, dass du %{name} löschen möchtest?
      title_miis: Bist du sicher, dass du %{amount} Miis löschen möchtest?
    update_admin:
      extra: Manchmal erfordert ein Update Adminrechte. Möchtest du sie für dieses
        Update aktivieren?
      title: Update mit Admin
