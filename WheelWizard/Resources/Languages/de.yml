        Wheel Wizard konnte die Version des eingerichteten Dolphin Emulator nicht lesen und kann daher nicht feststellen, ob die Sicherheitsupdates installiert sind.

        Bitte verifiziere manuell, dass du Version %{minimumVersion} oder neuer verwendest. Ältere Versionen haben eine bekannte Sicherheitslücke, mit welcher schädliche Spieldateien, Mods, oder cheatende Online-Spieler deinen PC mit Malware infizieren können.
      title: Die verwendete Dolphin Emulator-Version konnte nicht verifiziert werden
    fail_check_updates:
      extra: Es ist gerade nicht möglich, nach Updates zu suchen. Du bist vielleicht
