  helper_text:
    30_fps: Diese Einstellung erzwingt, dass das Spiel mit 30 FPS läuft (Standard
      ist 60).
    enable_animations: Dies aktiviert die Animationen in der Wheel Wizard App.
    enable_recomp: Verwende WiiCompiled, um das Spiel zu starten. Ist diese Option
      deaktiviert, wird Dolphin und Retro Rewind verwendet. Nur auf Windows.
    end_with_exe: Dateipfad muss mit .exe enden.
    end_with_x: 'Pfad kann enden mit:'
    force_disable_wiimote: Diese Einstellung deaktiviert die Wiimote im Spiel, sie
      kann aber weiterhin für den Wii-Kanal verwendet werden.
    installed_version: 'Installierte Version: %{version}'
    launch_rr_on_startup: Startet Retro Rewind automatisch, wenn Wheel Wizard gestartet
      wird
    launch_with_dolphin: Öffne Dolphins Hauptfenster zusammen mit dem Spiel.
    must_set_game_path: Du musst deine Mario Kart Wii-Spieldatei auswählen, um WiiCompiled
      spielen zu können.
    must_set_paths: Du musst erst diese 3 Dateipfade setzen, um Retro Rewind spielen
      zu können.
    optional: Optional
    recommended: Diese Einstellung wird bestimmte Dolphin-Einstellungen verändern,
      um Ruckeln und Lagspikes zu vermindern.
    recomp_clone_dolphin_data: Kopiert Dolphins aktuelle Speicherdaten, Miis und Wii-Einstellungen
      in private WiiCompiled-Daten.
    recomp_dolphin_data_not_found: Setze zuerst einen existierenden Dolphin-Benutzerordner
      in den Wheel Wizard-Einstellungen. Der Ordner muss einen "Wii"-Ordner enthalten.
    recomp_graphics_api: WiiCompiled funktioniert nur mit DirectX 12 und Vulkan zuverlässig,
      deswegen werden keine anderen Optionen angeboten.
    recomp_prevent_stutters: Während ein Shader noch kompiliert wird, werden die Objekte,
      die ihn benötigen, für einige Frames übersprungen, anstatt dass das gesamte
      Spiel ins Stocken gerät, bis er fertig ist. So kommt es zu einem winzigen Pop-in
      statt zu Rucklern.
    recomp_share_dolphin_data: WiiCompiled und Dolphin verwenden dieselben Speicherdaten,
      Miis und Wii-Einstellungen.
    recomp_shared_nand_warning: Starte Dolphin und WiiCompiled nicht gleichzeitig,
      während NAND-Daten geteilt werden.
    recomp_use_dolphin_data: Verwende Dolphin's "Wii"-Ordner, damit WiiCompiled Speicherdaten,
      Miis und Wii-Einstellungen von Dolphin verwenden kann. Die Änderung wird beim
      nächsten Start von WiiCompiled übernommen.
    renderer: Wählt das Grafik-Backend aus, das Dolphin zum Rendern des Spiels verwendet.
    resolution_scale: 1x ist die native Auflösung
    retro_rewind_folder: Öffnet den Ordner mit den installierten Retro Rewind-Dateien.
    retro_rewind_version: 'Installierte Retro Rewind Version: %{version}'
    select_dolphin_linux: Wähle eine Dolphin-Programmdatei aus oder gib einen Startbefehl
      ein
    select_dolphin_macos: Wähle Dolphin.app aus
    topbar:
      location_warning: Einstellungen sind deaktiviert, vervollständige erst die Dateispeicherorte.
    v_sync: Synchronisiert die Bildrate des Spiels mit deinem Bildschirm, um Screen
      Tearing zu verhindern.
    wh_wz_language: Dies ändert nur die Sprache innerhalb von Wheel Wizard. Um die
      Sprache innerhalb des Spiels anzupassen, musst du das in den Spieleinstellungen
      ändern.
    wheel_wizard_data_folder: Wähle aus, wo Wheel Wizard seine Dateien speichert.
      Das Verschieben könnte eine Weile dauern.
