      extra: Dolphin suosittelee, etteivät muut ohjelmat käytä Wii-dataa (NAND) suoraan,
        koska kaksi samaan aikaan siihen kirjoittavaa ohjelmaa voi vioittaa sen. Kopio
        pitää WiiCompiledin täysin erillään, mutta toisessa tehdyt edistymiset eivät
        näy toisessa.
      title: Kopioidaanko Dolphin-data vai käytetäänkö niitä suoraan?
    recomp_overwrite_dolphin_clone:
      extra: Korvaa nykyisen kloonin Dolphinin tiedoilla. Vain WiiCompiledissa muutetut
        tallennukset, Miit ja Wii-asetukset menetetään.
      title: Korvataanko yksityinen Dolphin-klooni?
    recomp_retro_wfc_unavailable:
      extra: WiiCompiled vaatii Retro WFC -palvelimia verkkopelaamista varten, ja
        ne eivät vastaa juuri nyt. Voit asentaa ilman verkkopeliä nyt; WiiCompiled
        lisää sen automaattisesti seuraavalla päivityskerralla, kun palvelimet ovat
        taas toiminnassa.
      title: Retro WFC:hen ei saada yhteyttä
    recomp_share_dolphin_data:
      extra: Kloonaus antaa WiiCompiledille samat nykyiset tallennukset, Miit ja Wii-asetukset,
        mutta pitää kopion erillään ja on turvallisempi. Suora jakaminen antaa Dolphinille
        ja WiiCompiledille mahdollisuuden kirjoittaa samaan NAND-muistiin, mikä voi
        vioittaa sitä, jos molemmat suorittavat samanaikaisesti. Jatka vain, jos ymmärrät
        riskin.
      title: Jaetaanko NAND-data Dolphinin kanssa?
    recomp_uninstall:
      extra_copy: Poistaa WiiCompiledin asennuksen sekä sen kopiot Dolphin-datastasi.
        Alkuperäinen Dolphin-data pysyy muuttumattomana, ja Retro Rewind pysyy asennettuna.
      extra_private: Poistaa WiiCompiledin asennuksen sekä sen yksityiset Wii-tallennustiedot.
        Retro Rewind pysyy asennettuna.
      extra_shared: Poistaa WiiCompiledin asennuksen. Tallennuksesi säilyy Dolphinin
        Wii-kansiossa, ja Retro Rewind pysyy asennettuna.
      title: Poistetaanko WiiCompiledin asennus?
    recomp_use_dolphin_nand:
      extra: WiiCompiled voi käyttää tallennuksia, Miitä ja kaverikoodeja, jotka ovat
        jo käytössä Dolphinissa. Jos niitä ei ole, se aloittaa alusta omalla Wii-datallaan.
      title: Käytetäänkö Dolphin-tallennustietoja?
    reinstall_rr:
      extra: Haluatko varmasti asentaa Retro Rewindin uudelleen?
      title: Asenna Retro Rewind uudelleen
    rr_not_determined:
      extra: Retro Rewind -versiotasi ei voitu määrittää. Haluatko ladata Retro Rewindin?
      title: Lataa Retro Rewind
    rr_to_old:
      extra: Retro Rewind -versiosi on liian vanha päivittämiseen. Haluatko asentaa
        Retro Rewindin uudelleen?
      title: Retro Rewind -versio on liian vanha.
    search_mod: Haetaan modeja...
    sure_delete:
      extra: Poistaminen on pysyvää eikä sitä voi perua.
      title: Haluatko varmasti poistaa '%{name}'?
      title_miis: Haluatko varmasti poistaa %{amount} Miitä?
    update_admin:
      extra: Joskus päivitys vaatii järjestelmänvalvojan oikeuet. Haluatko aktivoida
        ne tätä päivitystä varten?
      title: Päivitä järjestelmänvalvojana
