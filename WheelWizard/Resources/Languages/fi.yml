    recomp_uninstall:
      title: "Poistetaanko WiiCompiledin asennus?"
      extra_shared: "Poistaa WiiCompiledin asennuksen. Tallennuksesi säilyy Dolphinin Wii-kansiossa, ja Retro Rewind pysyy asennettuna."
      extra_private: "Poistaa WiiCompiledin asennuksen sekä sen yksityiset Wii-tallennustiedot. Retro Rewind pysyy asennettuna."
      extra_copy: "Poistaa WiiCompiledin asennuksen sekä sen kopiot Dolphin-datastasi. Alkuperäinen Dolphin-data pysyy muuttumattomana, ja Retro Rewind pysyy asennettuna."
    recomp_use_dolphin_nand:
      title: "Käytetäänkö Dolphin-tallennustietoja?"
      extra: "WiiCompiled voi käyttää tallennuksia, Miitä ja kaverikoodeja, jotka ovat jo käytössä Dolphinissa. Jos niitä ei ole, se aloittaa alusta omalla Wii-datallaan."
    recomp_retro_wfc_unavailable:
      title: "Retro WFC:hen ei saada yhteyttä"
      extra: "WiiCompiled vaatii Retro WFC -palvelimia verkkopelaamista varten, ja ne eivät vastaa juuri nyt. Voit asentaa ilman verkkopeliä nyt; WiiCompiled lisää sen automaattisesti seuraavalla päivityskerralla, kun palvelimet ovat taas toiminnassa."
    recomp_nand_mode:
      title: "Kopioidaanko Dolphin-data vai käytetäänkö niitä suoraan?"
      extra: "Dolphin suosittelee, etteivät muut ohjelmat käytä Wii-dataa (NAND) suoraan, koska kaksi samaan aikaan siihen kirjoittavaa ohjelmaa voi vioittaa sen. Kopio pitää WiiCompiledin täysin erillään, mutta toisessa tehdyt edistymiset eivät näy toisessa."
    recomp_share_dolphin_data:
      title: "Jaetaanko NAND-data Dolphinin kanssa?"
      extra: "Kloonaus antaa WiiCompiledille samat nykyiset tallennukset, Miit ja Wii-asetukset, mutta pitää kopion erillään ja on turvallisempi. Suora jakaminen antaa Dolphinille ja WiiCompiledille mahdollisuuden kirjoittaa samaan NAND-muistiin, mikä voi vioittaa sitä, jos molemmat suorittavat samanaikaisesti. Jatka vain, jos ymmärrät riskin."
    recomp_overwrite_dolphin_clone:
      title: "Korvataanko yksityinen Dolphin-klooni?"
      extra: "Korvaa nykyisen kloonin Dolphinin tiedoilla. Vain WiiCompiledissa muutetut tallennukset, Miit ja Wii-asetukset menetetään."
    launch_clear_mods_found:
      title: "Modeja löytyi"
