    must_set_paths: You must set these 3 paths before you can start playing Retro
      Rewind
    optional: Optional
    recommended: This setting will change certain dolphin settings to reduce stuttering
      and lag spikes
    recomp_clone_dolphin_data: Copies Dolphin's current saves, Miis, and Wii settings
      into private WiiCompiled data.
    recomp_dolphin_data_not_found: Set an existing Dolphin User Folder in Location
      Settings first. It must contain a Wii folder.
    recomp_graphics_api: Only DirectX 12 and Vulkan run WiiCompiled reliably, so nothing
      else is offered.
    recomp_gx_worker: Draws the game on its own thread so it runs faster. Turn this
      off if you get crashes or broken graphics. Takes effect the next time the game
      starts.
    recomp_prevent_stutters: While a shader is still compiling, the objects that need
      it are skipped for a few frames instead of the whole game stalling until it
      is ready. You get a tiny bit of pop-in instead of a stutter.
    recomp_share_dolphin_data: WiiCompiled and Dolphin use the same saves, Miis, and
      Wii settings.
    recomp_shared_nand_warning: Do not run Dolphin and WiiCompiled at the same time
      while sharing NAND data.
    recomp_use_dolphin_data: Use Dolphin's existing Wii folder in place so WiiCompiled
      shares saves, Miis, and Wii settings. A change takes effect the next time WiiCompiled
      launches.
    renderer: Selects the graphics backend Dolphin uses to render the game.
    resolution_scale: 1x is the native resolution
    retro_rewind_folder: Opens the folder containing the installed Retro Rewind files.
