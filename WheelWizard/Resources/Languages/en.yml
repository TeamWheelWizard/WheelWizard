    leave_mii_editor:
      extra: Your changes to this Mii will be lost.
      title: Leave without saving?
    move_data:
      extra: |-
        Wheel Wizard will move its files to:
        %{path}
        This may take a while depending on the amount of data.
      title: Move Wheel Wizard data?
    new_version_wh_wz:
      extra: Version %{latestVersion} of Wheel Wizard is available (currently on %{currentVersion}).
        Do you want to update now?
      title: Wheel Wizard Update Available
    old_rksys_found:
      extra: Old save data was found. Would you like to use it? (recommended)
      title: Old rksys.dat found
    quit_during_setup:
      extra: An install or update is still running. Quitting now can leave the game
        incomplete.
      title: Quit while installing?
    recomp_nand_mode:
      extra: Dolphin recommends against other programs using its Wii data (NAND) directly,
        since two programs writing to it at once can corrupt it. A copy keeps WiiCompiled
        completely separate, but progress made in one will not appear in the other.
      title: Copy your Dolphin data, or use it directly?
    recomp_overwrite_dolphin_clone:
      extra: This replaces the current clone with Dolphin's data. Saves, Miis, and
        Wii settings changed only in WiiCompiled will be lost.
      title: Replace the private Dolphin clone?
    recomp_retro_wfc_unavailable:
      extra: WiiCompiled needs the Retro WFC servers to set up online play, and they
        are not responding right now. You can install without online play now; WiiCompiled
        will add it automatically the next time you update once the servers are back.
      title: Retro WFC is unreachable
    recomp_share_dolphin_data:
      extra: Cloning gives WiiCompiled the same current saves, Miis, and Wii settings,
        but keeps its copy separate and is safer. Direct sharing lets Dolphin and
        WiiCompiled write to the same NAND, which can corrupt it if both run at once.
        Continue only if you understand the risk.
      title: Share NAND data with Dolphin?
    recomp_uninstall:
      extra_copy: This removes the WiiCompiled installation, including its copy of
        your Dolphin data. Your original Dolphin data is untouched, and Retro Rewind
        stays installed.
      extra_private: This removes the WiiCompiled installation, including its private
        Wii save data. Retro Rewind stays installed.
      extra_shared: This removes the WiiCompiled installation. Your saves stay in
        Dolphin's Wii folder, and Retro Rewind stays installed.
      title: Uninstall WiiCompiled?
    recomp_use_dolphin_nand:
      extra: WiiCompiled can play with the saves, Miis and friend codes you already
        use in Dolphin. If not, it starts fresh with its own Wii data.
      title: Use your Dolphin save data?
    reinstall_rr:
      extra: Are you sure you want to reinstall Retro Rewind?
      title: Reinstall Retro Rewind
    rr_not_determined:
      extra: Your version of Retro Rewind could not be determined. Would you like
        to download Retro Rewind?
