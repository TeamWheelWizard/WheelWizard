        le dossier My Stuff ?
      title: Mods trouvés
    launch_clear_patches_found:
      extra: Vous êtes sur le point de lancer le jeu sans mod. Voulez-vous supprimer
        le dossier des patchs ? Si vous lancez quand même, le dossier des patchs actuel
        sera utilisé !
    move_data:
      extra: |-
        Wheel Wizard déplacera ses fichiers vers:
        %{path}
        Cela peut prendre un moment selon la quantité de données.
      title: Déplacer les données de Wheel Wizard ?
    new_version_wh_wz:
      extra: 'La version %{latestVersion} de Wheel Wizard est disponible (Version
        actuelle: %{currentVersion}). Voulez-vous mettre à jour maintenant ?'
      title: Mise à jour de Wheel Wizard disponible !
    old_rksys_found:
      extra: Une ancienne sauvegarde a été trouvée. Voulez-vous l'utiliser ? (Recommandé)
      title: Ancien rksys.dat trouvé
    recomp_nand_mode:
      extra: Dolphin ne recommande pas l'utilisation directe de ses données Wii (NAND),
        car l'écriture de données par deux programmes en simultané peut provoquer
        leur corruption. Une copie isolera complètement WiiCompiled, mais la progression
        effectuée dans l'une des copies ne sera pas dans l'autre.
      title: Copier les données de Dolphin, ou les utiliser directement ?
    recomp_overwrite_dolphin_clone:
      extra: Cette option remplace la copie actuelle avec les données de Dolphin.
        Les sauvegardes, Miis, et paramètres Wii modifiés seulement sur WiiCompiled
        seront perdus.
      title: Remplacer la copie isolée de Dolphin ?
    recomp_retro_wfc_unavailable:
      extra: WiiCompiled a besoin des serveurs Retro WFC pour préparer les services
        en ligne, mais ils ne répondent pas. Vous pouvez installer sans les fonctionnalités
        en ligne; et WiiCompiled les ajoutera automatiquement lors de la prochaine
        mise à jour, une fois les serveurs en ligne.
      title: Impossible de communiquer avec Retro WFC
    recomp_share_dolphin_data:
      extra: La copie permet à WiiCompiled d'utiliser les mêmes sauvegardes, Miis,
        et paramètres Wii, mais garde sa copie isolée et est plus sûr. Le partage
        direct permet à Dolphin et WiiCompiled d'écrire sur la même NAND, ce qui peut
        la corrompre si les deux tournent en même temps. Continuez seulement si vous
        êtes conscient des risques.
      title: Partager les données de la NAND avec Dolphin ?
    recomp_uninstall:
      extra_copy: Cela supprime WiiCompiled, mais aussi la copie de vos données Dolphin.
        Les données originales restent intactes, et Retro Rewind reste installé.
      extra_private: Cela supprime WiiCompiled, mais aussi ses données de sauvegarde
        Wii privées, et Retro Rewind reste installé.
      extra_shared: Cela supprime WiiCompiled. Vos sauvegardes resteront dans le dossier
        Wii de Dolphin, et Retro Rewind reste installé.
