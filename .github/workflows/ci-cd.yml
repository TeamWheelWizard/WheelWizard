name: CI/CD for Wheel Wizard

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          # Without an explicit RID, the SDK's osx-arm64 apphost inference breaks on xunit.v3 test projects
          - os: macos-latest
            rid-args: -p:RuntimeIdentifier=osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.rid-args }}

      - name: Build solution
        run: dotnet build --configuration Release --no-restore ${{ matrix.rid-args }}

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal ${{ matrix.rid-args }}
