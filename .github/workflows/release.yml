name: Release Wheel Wizard

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore WheelWizard.sln

      - name: Run tests
        run: dotnet test WheelWizard.sln --configuration Release --no-restore --verbosity normal

      - name: Publish Windows x64
        run: >
          dotnet publish WheelWizard/WheelWizard.csproj
          --runtime win-x64
          --configuration Release
          --output publish/win-x64
          --self-contained true
          /p:UseAppHost=true
          /p:PublishSingleFile=true
          /p:IncludeAllContentForSelfExtract=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:EnableCompressionInSingleFile=true

      - name: Publish Linux x64
        run: >
          dotnet publish WheelWizard/WheelWizard.csproj
          --runtime linux-x64
          --configuration Release
          --output publish/linux-x64
          --self-contained true
          /p:UseAppHost=true
          /p:PublishSingleFile=true
          /p:IncludeAllContentForSelfExtract=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:EnableCompressionInSingleFile=true

      - name: Publish Linux ARM64
        run: >
          dotnet publish WheelWizard/WheelWizard.csproj
          --runtime linux-arm64
          --configuration Release
          --output publish/linux-arm64
          --self-contained true
          /p:UseAppHost=true
          /p:PublishSingleFile=true
          /p:IncludeAllContentForSelfExtract=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:EnableCompressionInSingleFile=true

      - name: Stage release assets
        run: |
          mkdir -p artifacts
          cp publish/win-x64/WheelWizard.exe artifacts/WheelWizardWindows.exe
          cp publish/linux-x64/WheelWizard artifacts/WheelWizard_Linux
          cp publish/linux-arm64/WheelWizard artifacts/WheelWizard_arm64_Linux
          chmod +x artifacts/WheelWizard_Linux artifacts/WheelWizard_arm64_Linux

      - name: Upload Linux + Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux-windows
          path: artifacts/
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # macOS builds (native on macOS runner)
  # ──────────────────────────────────────────────────────────────
  macos-arm64:
    name: Build macOS (arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build .app bundle for macOS arm64
        run: |
          chmod +x macos/release-macos.sh
          ./macos/release-macos.sh
        env:
          BUILD_ARCH: arm64

      - name: Ad-hoc sign the .app bundle
        run: |
          codesign --force --deep -s - "release/WheelWizard.app"

      - name: Create DMG
        id: create-dmg
        uses: L-Super/create-dmg-actions@v1
        with:
          dmg_name: WheelWizard-macOSarm64
          src_dir: release/WheelWizard.app
          background: macos/backgr.png
          window_size: 650 376
          icon_size: 128
          icon_position: 200 150
          app_drop_link: 450 150

      - name: Create .app zip for Homebrew
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            release/WheelWizard.app \
            WheelWizard-macOSarm64.zip

      - name: Compute SHA256
        id: sha
        run: |
          echo "sha256=$(shasum -a 256 WheelWizard-macOSarm64.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos-arm64
          path: |
            WheelWizard-macOSarm64.dmg
            WheelWizard-macOSarm64.zip
          retention-days: 1

  macos-x64:
    name: Build macOS (x64)
    # Cross-compile x64 on an arm64 runner since macos-13 (Intel) is deprecated.
    # .NET handles cross-compilation via the runtime identifier (osx-x64).
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build .app bundle for macOS x64
        run: |
          chmod +x macos/release-macos.sh
          ./macos/release-macos.sh
        env:
          BUILD_ARCH: x64

      - name: Ad-hoc sign the .app bundle
        run: |
          codesign --force --deep -s - "release/WheelWizard.app"

      - name: Create DMG
        id: create-dmg
        uses: L-Super/create-dmg-actions@v1
        with:
          dmg_name: WheelWizard-macOSintel
          src_dir: release/WheelWizard.app
          background: macos/backgr.png
          window_size: 650 376
          icon_size: 128
          icon_position: 200 150
          app_drop_link: 450 150

      - name: Create .app zip for Homebrew
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            release/WheelWizard.app \
            WheelWizard-macOSintel.zip

      - name: Compute SHA256
        id: sha
        run: |
          echo "sha256=$(shasum -a 256 WheelWizard-macOSintel.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos-x64
          path: |
            WheelWizard-macOSintel.dmg
            WheelWizard-macOSintel.zip
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # Create GitHub release with all assets
  # ──────────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [release, macos-arm64, macos-x64]

    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Prepare release assets
        run: |
          mkdir -p final-artifacts

          # Linux & Windows
          cp artifacts-linux-windows/WheelWizardWindows.exe final-artifacts/
          cp artifacts-linux-windows/WheelWizard_Linux final-artifacts/
          cp artifacts-linux-windows/WheelWizard_arm64_Linux final-artifacts/

          # macOS DMGs
          cp artifacts-macos-arm64/WheelWizard-macOSarm64.dmg final-artifacts/ 2>/dev/null || true
          cp artifacts-macos-x64/WheelWizard-macOSintel.dmg final-artifacts/ 2>/dev/null || true

          # macOS .app zips (for Homebrew)
          cp artifacts-macos-arm64/WheelWizard-macOSarm64.zip final-artifacts/ 2>/dev/null || true
          cp artifacts-macos-x64/WheelWizard-macOSintel.zip final-artifacts/ 2>/dev/null || true

          chmod +x final-artifacts/WheelWizard_Linux final-artifacts/WheelWizard_arm64_Linux 2>/dev/null || true
          ls -la final-artifacts/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=""
          for f in final-artifacts/*; do
            ASSETS="$ASSETS \"$f\""
          done
          eval gh release create "${{ github.ref_name }}" $ASSETS \
            --title "${{ github.ref_name }}" \
            --generate-notes

  # ──────────────────────────────────────────────────────────────
  # Update Homebrew tap with new version and SHA256
  # ──────────────────────────────────────────────────────────────
  update-tap:
    name: Update Homebrew Tap
    needs: [create-release]
    runs-on: ubuntu-latest

    steps:
      - name: Bump cask version and SHA256
        uses: macauley/action-homebrew-bump-cask@v1
        with:
          token: ${{ secrets.TAP_TOKEN }}
          tap: gdmagana/tap
          cask: wheelwizard
          version: ${{ github.ref_name }}
          livecheck: false
